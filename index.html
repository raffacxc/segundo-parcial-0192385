<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dwello - Find Your Dream Dome</title>

    <!-- Tipografia Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- Vinculacion al CSS dentro de la carpeta styles-->
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <!-- ================== HEADER / NAVEGACION ================== -->
    <header class="navbar">
        <div class="logo">
            <span>Dwello</span>
        </div>
        <nav class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">Service</a>
            <a href="#">Agents</a>
            <a href="#">Contact</a>
        </nav>
        <div class="nav-actions">
            <button class="icon-btn" aria-label="Search"></button>
            <button class="icon-btn" aria-label="User"></button>
            <a href="#" class="btn-signup">Sign Up</a>
        </div>
    </header>
    <!-- ================== HERO SECTION ================== -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Find Your Dream Dome</h1>
            <p class="hero-description">Explore our curated selection of exquisite properties meticulously tailored to your unique dream home vision</p>
            <a href="#" class="btn-primary">Sign up</a>
        </div>

        <!-- Barra de Busqueda Flotante / Filtro -->
        <div class="search-bar">
            <div class="search-item">
                <div class="search-info">
                    <span class="label">Location</span>
                    <span class="icon"></span>
                </div>
            </div>
            
            <div class="search-divider"></div>
            
            <div class="search-item">
                <div class="search-info">
                    <span class="label">Type</span>
                    <span class="icon"></span>
                </div>
            </div>

            <div class="search-divider"></div>

            <div class="search-item">
                <div class="search-info">
                    <span class="label">Price Range</span>
                    <span class="icon"></span>
                </div>
            </div>

            <button class="btn-search">Sign up</button>
        </div>  
    </section>
    <h1>Hello World</h1>
</body>
</html>
